<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- Shield icon -->
  <g transform="translate(0, 4)">
    <!-- Shield outer -->
    <path d="M16 2L4 7v9c0 7.5 5.2 14.5 12 16 6.8-1.5 12-8.5 12-16V7L16 2z"
          fill="#0D9373" opacity="0.15"/>
    <!-- Shield inner gradient fill -->
    <path d="M16 2L4 7v9c0 7.5 5.2 14.5 12 16 6.8-1.5 12-8.5 12-16V7L16 2z"
          fill="none" stroke="#0D9373" stroke-width="1.5"/>
    <!-- Checkmark / scan lines inside shield -->
    <line x1="9" y1="16" x2="19" y2="16" stroke="#0D9373" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="9" y1="19" x2="16" y2="19" stroke="#0D9373" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <!-- Check mark -->
    <polyline points="10,16 14,20 22,12" stroke="#0D9373" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Node dots (multi-agent network) -->
  <circle cx="38" cy="12" r="2.5" fill="#0D9373" opacity="0.7"/>
  <circle cx="44" cy="22" r="2" fill="#0D9373" opacity="0.5"/>
  <circle cx="34" cy="24" r="1.8" fill="#07C983" opacity="0.6"/>
  <line x1="38" y1="12" x2="44" y2="22" stroke="#0D9373" stroke-width="0.8" opacity="0.4"/>
  <line x1="38" y1="12" x2="34" y2="24" stroke="#0D9373" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="22" x2="34" y2="24" stroke="#0D9373" stroke-width="0.8" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="54" y="17" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="700" font-size="13" fill="#0f172a" letter-spacing="-0.3">
    MAS
  </text>
  <text x="54" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="400" font-size="8.5" fill="#64748b" letter-spacing="0.4">
    SECURITY SCANNER
  </text>
</svg>
