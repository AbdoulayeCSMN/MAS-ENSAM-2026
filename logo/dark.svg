<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- Shield icon -->
  <g transform="translate(0, 4)">
    <!-- Shield outer glow -->
    <path d="M16 2L4 7v9c0 7.5 5.2 14.5 12 16 6.8-1.5 12-8.5 12-16V7L16 2z"
          fill="#07C983" opacity="0.12"/>
    <!-- Shield border -->
    <path d="M16 2L4 7v9c0 7.5 5.2 14.5 12 16 6.8-1.5 12-8.5 12-16V7L16 2z"
          fill="none" stroke="#07C983" stroke-width="1.5"/>
    <!-- Checkmark -->
    <polyline points="10,16 14,20 22,12" stroke="#07C983" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Node dots (multi-agent network) -->
  <circle cx="38" cy="12" r="2.5" fill="#07C983" opacity="0.8"/>
  <circle cx="44" cy="22" r="2"   fill="#07C983" opacity="0.55"/>
  <circle cx="34" cy="24" r="1.8" fill="#0D9373" opacity="0.7"/>
  <line x1="38" y1="12" x2="44" y2="22" stroke="#07C983" stroke-width="0.8" opacity="0.45"/>
  <line x1="38" y1="12" x2="34" y2="24" stroke="#07C983" stroke-width="0.8" opacity="0.45"/>
  <line x1="44" y1="22" x2="34" y2="24" stroke="#07C983" stroke-width="0.8" opacity="0.45"/>

  <!-- Wordmark -->
  <text x="54" y="17" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="700" font-size="13" fill="#f1f5f9" letter-spacing="-0.3">
    MAS
  </text>
  <text x="54" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="400" font-size="8.5" fill="#94a3b8" letter-spacing="0.4">
    SECURITY SCANNER
  </text>
</svg>
